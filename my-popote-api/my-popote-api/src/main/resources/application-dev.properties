# ===============================
# DEVELOPMENT DATABASE
# ===============================
# En développement, l'API utilise exclusivement
# la MariaDB Docker locale.
spring.datasource.url=jdbc:mariadb://localhost:3307/my_popote
spring.datasource.username=my_popote
spring.datasource.password=my_popote_dev
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ===============================
# FLYWAY
# ===============================
# Les mêmes migrations sont utilisées en développement
# et en production afin de conserver des schémas identiques.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ===============================
# DEVELOPMENT SMTP
# ===============================
# Les identifiants Brevo restent dans les variables
# d'environnement et ne sont jamais enregistrés dans Git.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.from=${MAIL_FROM}
app.frontend.url=${FRONTEND_URL:http://localhost:4200}
# ===============================
# PRODUCTION DATABASE
# ===============================
# Dans Docker Compose, "mariadb" est le nom du service de base de données.
# Le port 3306 est accessible uniquement sur le réseau interne Docker.
spring.datasource.url=jdbc:mariadb://mariadb:3306/my_popote
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ===============================
# FLYWAY
# ===============================
# Les migrations créent et font évoluer le schéma de la base.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===============================
# JPA / HIBERNATE
# ===============================
# Hibernate vérifie le schéma sans le modifier.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===============================
# SERVER
# ===============================
server.port=8080

# ===============================
# SECURITY / JWT
# ===============================
# La clé secrète sera fournie au conteneur par une variable d'environnement.
app.jwt.secret=${JWT_SECRET}

# ===============================
# SECURITY / CORS
# ===============================
# L'origine autorisée sera l'adresse HTTPS réelle de My Popote.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ===============================
# PASSWORD RESET
# ===============================
# URL publique du frontend utilisée dans les liens envoyés par e-mail.
app.frontend.url=${FRONTEND_URL}
app.mail.from=${MAIL_FROM}

# ===============================
# SMTP
# ===============================
# Les identifiants SMTP ne sont pas enregistrés dans Git.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
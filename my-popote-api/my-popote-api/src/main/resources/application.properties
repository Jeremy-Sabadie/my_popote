spring.application.name=my-popote-api

# ===============================
# DATABASE - MariaDB Cloud
# ===============================
spring.datasource.url=jdbc:mariadb://serverless-europe-west9.sysp0000.db2.skysql.com:4041/my_popote?sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ===============================
# FLYWAY
# ===============================
# Flyway gère les évolutions du schéma de la base de données
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===============================
# JPA / HIBERNATE
# ===============================
# Hibernate vérifie le schéma mais ne le modifie jamais
spring.jpa.hibernate.ddl-auto=validate

# Affiche les requêtes SQL pendant le développement
spring.jpa.show-sql=true

# Évite de garder une session Hibernate ouverte jusqu'à la couche web
spring.jpa.open-in-view=false

# Évite d'afficher dans les logs les informations détaillées
# de connexion JDBC pouvant contenir des secrets.
logging.level.org.hibernate.orm.connections.pooling=WARN

# ===============================
# SERVER
# ===============================
server.port=8080

# ===============================
# SECURITY / JWT
# ===============================
# La clé JWT est fournie par une variable d'environnement.
# Elle ne doit jamais être enregistrée dans Git.
app.jwt.secret=${JWT_SECRET}

# ===============================
# SECURITY / CORS
# ===============================
# Angular tourne sur localhost:4200 en développement.
# En production, CORS_ALLOWED_ORIGINS contiendra l'URL du frontend Render.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ===============================
# PASSWORD RESET
# ===============================
# URL utilisée pour construire le lien envoyé par e-mail.
# En production, FRONTEND_URL contiendra l'URL Render du frontend.
app.frontend.url=${FRONTEND_URL:http://localhost:4200}

# Adresse affichée comme expéditeur du message.
app.mail.from=${MAIL_FROM}

# ===============================
# SMTP
# ===============================
# Tous les identifiants SMTP restent dans les variables
# d'environnement et ne sont jamais enregistrés dans Git.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Le serveur SMTP doit utiliser une connexion authentifiée
# protégée par STARTTLS.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Empêche une indisponibilité SMTP de bloquer
# indéfiniment une requête de l'API.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
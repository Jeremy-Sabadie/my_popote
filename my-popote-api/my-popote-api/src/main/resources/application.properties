
spring.application.name=my-popote-api

# ===============================
# DATABASE - MariaDB Cloud
# ===============================
spring.datasource.url=jdbc:mariadb://serverless-europe-west9.sysp0000.db2.skysql.com:4041/my_popote?sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ===============================
# FLYWAY
# ===============================
# Flyway gere les evolutions du schema de la base de donnees.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===============================
# JPA / HIBERNATE
# ===============================
# Hibernate verifie le schema sans le modifier.
spring.jpa.hibernate.ddl-auto=validate

# Affichage des requetes SQL.
spring.jpa.show-sql=true

# Desactive Open Session In View.
spring.jpa.open-in-view=false

# Evite d'afficher les informations de connexion JDBC.
logging.level.org.hibernate.orm.connections.pooling=WARN

# ===============================
# SERVER
# ===============================
server.port=8080

# ===============================
# SECURITY / JWT RS256
# ===============================
# Les cles RSA sont chargees depuis des fichiers externes.
# Ne jamais enregistrer les cles privees dans Git.

app.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH}
app.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH}

# Identite de l'emetteur des JWT.
# Doit correspondre a l'issuer attendu par ProductPulse.
app.jwt.issuer=${JWT_ISSUER}

# Audience principale de My Popote.
# JwtService ajoute egalement l'audience productpulse.
app.jwt.audience=mypopote

# ===============================
# SECURITY / CORS
# ===============================
# Origines autorisees pour les appels depuis Angular.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ===============================
# PASSWORD RESET
# ===============================
# URL du frontend utilisee pour les liens de reinitialisation.
app.frontend.url=${FRONTEND_URL:http://localhost:4200}

# Adresse expediteur des e-mails.
app.mail.from=${MAIL_FROM}

# ===============================
# SMTP
# ===============================
# Identifiants fournis exclusivement par l'environnement.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Connexion SMTP securisee avec STARTTLS.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Delais pour eviter les blocages en cas de panne SMTP.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

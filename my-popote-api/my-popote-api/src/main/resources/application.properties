spring.application.name=my-popote-api

# ===============================
# DATABASE - MariaDB Cloud
# ===============================
spring.datasource.url=jdbc:mariadb://serverless-europe-west9.sysp0000.db2.skysql.com:4041/my_popote?sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ===============================
# FLYWAY
# ===============================
# Flyway gère les évolutions du schéma de la base de données
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===============================
# JPA / HIBERNATE
# ===============================
# Hibernate vérifie le schéma mais ne le modifie jamais
spring.jpa.hibernate.ddl-auto=validate

# Affiche les requêtes SQL pendant le développement
spring.jpa.show-sql=true

# Évite de garder une session Hibernate ouverte jusqu'à la couche web
spring.jpa.open-in-view=false

# Évite d'afficher dans les logs les informations détaillées
# de connexion JDBC pouvant contenir des secrets.
logging.level.org.hibernate.orm.connections.pooling=WARN

# ===============================
# SERVER
# ===============================
server.port=8080

# ===============================
# SECURITY / JWT
# ===============================
# La clé JWT est fournie par une variable d'environnement.
# Elle ne doit jamais être enregistrée dans Git.
app.jwt.secret=${JWT_SECRET}

# ===============================
# SECURITY / CORS
# ===============================
# Angular tourne sur localhost:4200 en développement.
# En production, CORS_ALLOWED_ORIGINS contiendra l'URL du frontend Render.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
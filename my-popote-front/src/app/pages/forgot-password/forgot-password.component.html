<section class="auth-page">
  <div class="auth-card">

    <header>
      <p class="eyebrow">My Popote</p>
      <h1>Mot de passe oublié</h1>

      <p class="subtitle">
        Indiquez votre adresse e-mail pour recevoir
        un lien de réinitialisation.
      </p>
    </header>

    <div *ngIf="submitted" class="success-message" role="status">
      Si un compte existe avec cette adresse, un e-mail de
      réinitialisation a été envoyé.
    </div>

    <form *ngIf="!submitted" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="email">Adresse e-mail</label>

        <input id="email" type="email" formControlName="email" autocomplete="email" inputmode="email" />

        <small *ngIf="form.controls.email.touched && form.controls.email.invalid" class="field-error">
          Saisissez une adresse e-mail valide.
        </small>
      </div>

      <p *ngIf="errorMessage" class="auth-error" role="alert">
        {{ errorMessage }}
      </p>

      <button type="submit" class="primary-button" [disabled]="loading">
        {{ loading ? 'Envoi…' : 'Envoyer le lien' }}
      </button>
    </form>

    <a routerLink="/sign-in" class="back-link">
      Retour à la connexion
    </a>

  </div>
</section>

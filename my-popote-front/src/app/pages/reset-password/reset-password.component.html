<section class="auth-page">
  <div class="auth-card">

    <header>
      <p class="eyebrow">My Popote</p>
      <h1>Nouveau mot de passe</h1>

      <p class="subtitle">
        Choisissez un nouveau mot de passe pour votre compte.
      </p>
    </header>

    <div *ngIf="success" class="success-message" role="status">
      Votre mot de passe a été modifié.

      <a routerLink="/sign-in">
        Vous pouvez maintenant vous connecter.
      </a>
    </div>

    <form *ngIf="!success" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="password">Nouveau mot de passe</label>

        <input id="password" type="password" formControlName="password" autocomplete="new-password" />

        <small *ngIf="form.controls.password.touched && form.controls.password.invalid" class="field-error">
          Utilisez au moins 8 caractères.
        </small>
      </div>

      <div class="field">
        <label for="confirmation">
          Confirmez le mot de passe
        </label>

        <input id="confirmation" type="password" formControlName="confirmation" autocomplete="new-password" />
      </div>

      <p *ngIf="errorMessage" class="auth-error" role="alert">
        {{ errorMessage }}
      </p>

      <button type="submit" class="primary-button" [disabled]="loading">
        {{ loading ? 'Modification…' : 'Modifier mon mot de passe' }}
      </button>
    </form>

  </div>
</section>

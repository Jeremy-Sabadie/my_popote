<section class="auth-page">
  <div class="auth-card">
    <header>
      <p class="eyebrow">My Popote</p>
      <h1>Connexion</h1>
      <p class="subtitle">
        Connecte-toi pour retrouver tes recettes et ta semaine.
      </p>
    </header>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="email">Adresse e-mail</label>

        <input id="email" type="email" formControlName="email" autocomplete="email" inputmode="email" />

        <small *ngIf="
            form.controls.email.touched &&
            form.controls.email.invalid
          " class="field-error">
          Saisis une adresse e-mail valide.
        </small>
      </div>

      <div class="field">
        <label for="password">Mot de passe</label>

        <input id="password" type="password" formControlName="password" autocomplete="current-password" />

        <small *ngIf="
            form.controls.password.touched &&
            form.controls.password.invalid
          " class="field-error">
          Le mot de passe est obligatoire.
        </small>
      </div>

      <p *ngIf="errorMessage" class="auth-error" role="alert">
        {{ errorMessage }}
      </p>

      <button type="submit" class="primary-button" [disabled]="loading">
        {{ loading ? 'Connexion…' : 'Se connecter' }}
      </button>
    </form>

    <p class="switch-auth">
      Pas encore de compte ?
      <a routerLink="/sign-up">Créer mon compte</a>
    </p>
  </div>
</section>

<header class="app-header">

  <a class="brand" routerLink="/home" aria-label="Retour au tableau de bord My Popote">
    <span class="brand-icon">
      🍳
    </span>

    <span class="brand-name">
      My Popote
    </span>
  </a>

  @if (isAuthenticated) {

  <div class="user-menu" (click)="$event.stopPropagation()">

    <button type="button" class="user-menu-trigger" aria-haspopup="menu" [attr.aria-expanded]="menuOpen"
      (click)="toggleUserMenu($event)">

      <span class="user-avatar" aria-hidden="true">
        {{ userInitial }}
      </span>

      <span class="user-name">
        {{ user?.firstName }}
      </span>

      <span class="chevron" [class.chevron-open]="menuOpen" aria-hidden="true">
        ▾
      </span>

    </button>

    @if (menuOpen) {

    <div class="user-dropdown" role="menu">

      <div class="user-summary">
        <strong>
          {{ user?.firstName }}
        </strong>

        <span>
          {{ user?.email }}
        </span>
      </div>

      <div class="menu-separator"></div>

      <a routerLink="/settings" class="menu-item" role="menuitem" (click)="closeUserMenu()">
        <span aria-hidden="true">👤</span>
        Mon profil
      </a>

      <div class="menu-separator"></div>

      <button type="button" class="menu-item logout-item" role="menuitem" (click)="logout()">
        <span aria-hidden="true">↪</span>
        Se déconnecter
      </button>

    </div>

    }

  </div>

  }

</header>
